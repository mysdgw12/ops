<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>行动档案 · OPERATIONS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1113">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="行动档案">
<meta name="description" content="明日方舟风格的个人事件档案、重要度分级与提醒工具">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ 启动动画 ============ -->
<div id="splash">
  <div class="sp-in">
    <div class="sp-logo">OPEN<span>/</span>OPS</div>
    <div class="sp-cn">行动档案</div>
    <div class="sp-bar"><i></i></div>
    <div class="sp-tip" id="spTip">SYSTEM BOOTING…</div>
  </div>
</div>

<div id="app">
  <!-- ============ 顶部标题区 ============ -->
  <header class="hdr">
    <div class="hdr-meta">
      <span id="hdrDate">WED 19/11</span>
      <span class="sep">/</span>
      <span id="hdrClock">--:--</span>
      <span class="sep">/</span>
      <span class="live" id="hdrLive">LOCAL</span>
    </div>
    <div class="hdr-row">
      <div style="min-width:0">
        <h1 class="hdr-title" id="hdrTitle">OPERATIONS</h1>
        <div class="hdr-sub">
          <span class="bar"></span>
          <span id="hdrSub">事件档案</span>
          <span class="num" id="hdrCount">00</span>
        </div>
      </div>
      <div class="hdr-right">
        <button class="icon-btn" type="button" data-act="add" aria-label="新建事件" title="新建事件">
          <svg viewBox="0 0 24 24" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">

    <!-- ============ 档案 ============ -->
    <section class="view on" id="v-archive">
      <form class="qa" id="qaForm" autocomplete="off">
        <div class="qa-wrap">
          <span class="pre">&gt;</span>
          <input id="qaInput" type="text" placeholder="明天9点 交报告 !高 #工作" enterkeyhint="done">
        </div>
        <button class="qa-btn" type="submit" aria-label="添加">
          <svg viewBox="0 0 24 24" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>

      <div class="filters" id="filterBar"></div>
      <div class="tagbar" id="tagBar"></div>

      <div class="search-row">
        <input id="searchInput" type="text" placeholder="搜索标题 / 备注 / 标签" enterkeyhint="search" autocomplete="off">
        <button class="search-clear" id="searchClear" type="button" aria-label="清除搜索" hidden>
          <svg viewBox="0 0 24 24" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div id="listWrap"></div>
    </section>

    <!-- ============ 日程 ============ -->
    <section class="view" id="v-schedule">
      <div class="stat-grid" id="schedStats"></div>
      <div id="schedWrap"></div>
    </section>

    <!-- ============ 统计 ============ -->
    <section class="view" id="v-stats">
      <div id="statsWrap"></div>
    </section>

    <!-- ============ 设置 ============ -->
    <section class="view" id="v-settings">
      <div id="setWrap"></div>
    </section>

  </main>

  <!-- ============ 底部导航 ============ -->
  <nav class="nav">
    <button class="nav-item on" type="button" data-view="archive">
      <svg viewBox="0 0 24 24" stroke-linecap="square"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>档案</span>
    </button>
    <button class="nav-item" type="button" data-view="schedule">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>
      <span>日程</span>
      <i class="dot-badge" id="navBadge">0</i>
    </button>
    <button class="nav-item" type="button" data-view="stats">
      <svg viewBox="0 0 24 24" stroke-linecap="square"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>统计</span>
    </button>
    <button class="nav-item" type="button" data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<!-- ============ 编辑弹层 ============ -->
<div class="modal" id="modal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edHead">
    <div class="sheet-hd">
      <span class="t" id="edHead">NEW EVENT / 新建事件</span>
      <button class="x" type="button" data-act="close" aria-label="关闭">
        <svg viewBox="0 0 24 24" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="sheet-bd">
      <div class="fld">
        <label for="edTitle">事件标题 TITLE</label>
        <input id="edTitle" type="text" placeholder="要做什么？" autocomplete="off">
      </div>

      <div class="fld">
        <label>重要程度 PRIORITY</label>
        <div class="pri-seg" id="edPrio">
          <button type="button" data-p="0"><span class="sq"></span>紧急</button>
          <button type="button" data-p="1"><span class="sq"></span>高</button>
          <button type="button" data-p="2"><span class="sq"></span>中</button>
          <button type="button" data-p="3"><span class="sq"></span>低</button>
        </div>
      </div>

      <div class="fld">
        <label for="edDate">截止时间 DEADLINE</label>
        <div class="row2">
          <input id="edDate" type="date">
          <input id="edTime" type="time">
        </div>
        <div class="quick-times" id="edQuick">
          <button type="button" data-q="today">今天</button>
          <button type="button" data-q="tomorrow">明天</button>
          <button type="button" data-q="evening">今晚20:00</button>
          <button type="button" data-q="weekend">本周日</button>
          <button type="button" data-q="nextweek">下周一</button>
          <button type="button" data-q="clear">清除</button>
        </div>
      </div>

      <div class="fld">
        <label for="edRepeat">重复 REPEAT</label>
        <select id="edRepeat">
          <option value="">不重复</option>
          <option value="daily">每天</option>
          <option value="weekdays">每个工作日（周一至周五）</option>
          <option value="weekly">每周</option>
          <option value="monthly">每月</option>
        </select>
      </div>

      <div class="fld">
        <label>标签 TAGS</label>
        <div class="tag-input-wrap" id="edTags">
          <input id="edTagInput" type="text" placeholder="输入后按回车" autocomplete="off">
        </div>
        <div class="hint">回车添加，点标签后的 × 删除</div>
      </div>

      <div class="fld">
        <label>子任务 SUBTASKS</label>
        <div class="sub-list" id="edSubList"></div>
        <div class="sub-add">
          <input id="edSubInput" type="text" placeholder="添加一个步骤…" autocomplete="off">
          <button type="button" id="edSubAdd">＋</button>
        </div>
      </div>

      <div class="fld">
        <label for="edNote">备注 NOTES</label>
        <textarea id="edNote" placeholder="补充说明、上下文、链接…"></textarea>
      </div>
    </div>

    <div class="sheet-ft">
      <button class="btn danger sm" type="button" data-act="delete" id="btnDel" style="flex:0 0 74px">删除</button>
      <button class="btn ghost" type="button" data-act="close">取消</button>
      <button class="btn pri" type="button" data-act="save" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- ============ 完成盖章 ============ -->
<div class="stamp" id="stamp">
  <div class="stamp-in">
    <span class="a">TARGET CLEARED</span>
    <span class="b">MISSION COMPLETE</span>
    <span class="c">任务已完成 · 归档</span>
  </div>
</div>

<div id="banners"></div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
